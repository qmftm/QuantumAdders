# QuantumAdders 한국어 메시지.
# 값은 MiniMessage 형식이고, <item> 같은 태그가 자리표시자입니다.
# 자리표시자는 순서를 바꾸거나 빼도 됩니다. <prefix>는 아래 prefix 값으로 치환됩니다.

prefix: "<aqua>[QuantumAdders] </aqua>"

command:
  unknown-item: "<prefix><red>'<item>' 아이템을 찾을 수 없습니다. /qa list 로 확인하세요."
  give-success: "<prefix><white><item> <amount>개를 <count>명에게 지급했습니다."
  list-empty: "<prefix><white>정의된 아이템이 없습니다. plugins/QuantumAdders/items/ 를 확인하세요."
  list-header: "<prefix><white>커스텀 아이템 <count>개:"
  list-entry: "<white>  <item>  <dark_gray><base>"
  list-blocks-header: "<prefix><white>커스텀 블록 <count>개 <gray>(note block 상태 <used>/<capacity> 사용, <free>개 남음)"
  list-block-entry: "<white>  <item>  <dark_gray><state>"
  reload-done: "<prefix><white>아이템 <count>개를 다시 불러왔습니다."
  reload-geyser-note: "<gray>Geyser는 시작할 때 만든 아이템 목록을 그대로 씁니다. 베드락 쪽에 반영하려면 서버를 다시 시작하세요."
  pack-building: "<prefix><white>리소스팩을 만드는 중..."
  pack-done: "<prefix><white>아이템 <count>개로 리소스팩을 만들었습니다."
  pack-path-java: "<gray>  Java:    <path>"
  pack-path-bedrock: "<gray>  Bedrock: <path>"
  pack-path-mappings: "<gray>  매핑:    <path>"
  pack-missing-textures: "<yellow>텍스처 없음: <items>"
  pack-installed: "<gray>베드락 팩을 Geyser 폴더에 설치했습니다. 적용하려면 서버를 다시 시작하세요."
  pack-error: "<prefix><red><reason>"

log:
  items-loaded: "커스텀 아이템 <count>개를 불러왔습니다."
  geyser-absent: "이 서버에서는 Geyser가 실행되지 않습니다. 자바 플레이어는 영향이 없고, 베드락은 아래 매핑 안내를 참고하세요."
  geyser-subscribed: "Geyser의 커스텀 아이템 등록에 연결했습니다."
  geyser-registered: "Geyser에 커스텀 아이템 <count>개를 등록했습니다."
  geyser-not-initialised: "Geyser가 설치되어 있지만 아직 초기화되지 않았습니다. 베드락 플레이어에게는 커스텀 아이템이 보이지 않습니다."
  geyser-hook-failed: "Geyser 연결에 실패했습니다 (<reason>). 생성된 매핑 파일로 대체합니다."
  geyser-item-rejected: "Geyser가 '<item>' 아이템을 거부했습니다: <reason>"
  geyser-unknown-category: "'<item>' 아이템의 creative-category '<value>' 를 알 수 없어 ITEMS 로 대체합니다."
  mappings-note: "Geyser가 이 서버에 없어 API로 등록하지 못했습니다. <path> 파일을 외부 Geyser의 custom_mappings 폴더에, .mcpack 을 packs 폴더에 복사한 뒤 Geyser를 다시 시작하세요."
  pack-installed: "베드락 팩을 <path> 에 설치했습니다."
  missing-textures: "텍스처를 찾을 수 없는 아이템: <items>. PNG 파일을 <path> 에 넣고 /qa pack 을 실행하세요."
  pack-failed: "<what> 생성 실패: <reason>"
  geyser-folder-missing: "Geyser 팩 폴더를 찾을 수 없어 .mcpack 을 설치하지 못했습니다."
  install-failed: ".mcpack 을 Geyser에 설치하지 못했습니다: <reason>"
  invalid-path: "'<value>' 는 사용할 수 없는 경로입니다. 대신 <path> 에 생성합니다."

item:
  no-items-section: "<file> 에 'items' 항목이 없어 건너뜁니다."
  duplicate-id: "아이템 id '<item>' 이 <other> 와 <file> 양쪽에 있습니다. <file> 의 정의를 사용합니다."
  invalid-id: "<where>: id 는 영소문자·숫자·밑줄만 쓸 수 있습니다. 건너뜁니다."
  missing-base: "<where>: 'base' 가 없어 건너뜁니다."
  invalid-base: "<where>: '<value>' 는 올바른 아이템이 아닙니다. 건너뜁니다."
  invalid-stack-size: "<where>: max-stack-size 는 1~99 여야 합니다. 무시합니다."
  invalid-namespace: "네임스페이스 '<value>' 는 영소문자·숫자·밑줄만 쓸 수 있습니다. 'quantumadders' 로 대체합니다."
  example-failed: "예시 아이템 파일을 만들지 못했습니다: <reason>"
  directory-failed: "<path> 폴더를 만들지 못했습니다."
  repeated-key: "<file> 안에서 아이템 id '<item>' 이 두 번 이상 정의되었습니다. 마지막 것만 적용되니 id 를 서로 다르게 지으세요."

block:
  blocks-loaded: "커스텀 블록 <count>개를 불러왔습니다. (note block 상태 <used>/<capacity> 사용)"
  no-blocks-section: "<file> 에 'blocks' 항목이 없어 건너뜁니다."
  duplicate-id: "<file> 의 블록 id '<item>' 이 다른 아이템/블록과 겹칩니다. 건너뜁니다."
  pool-exhausted: "note block 상태를 모두 썼습니다 (<count>개). '<item>' 블록을 등록하지 못했습니다."
  states-save-failed: "block-states.yml 을 저장하지 못했습니다: <reason>"
  invalid-xp: "<where>: xp 값 '<value>' 를 숫자나 범위로 읽을 수 없습니다. 0 으로 둡니다."
